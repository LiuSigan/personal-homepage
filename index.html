<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liu Sigan — Photographs</title>
<meta name="description" content="Black and white photographs by Liu Sigan." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="bar top site">
  <nav><a href="#sheet">Sheet</a><a href="#index">Index</a></nav>
</header>

<section class="hero" id="top">
  <h1 aria-label="Liu Sigan"><span class="w" aria-hidden="true">Liu</span> <span class="w it" aria-hidden="true">Sigan</span></h1>
  <div class="sketch" aria-hidden="true">
    <canvas id="sketch"></canvas>
    <p class="plate" id="plate"><span id="plateNum"></span><span id="plateName"></span><span id="plateNote"></span></p>
  </div>
  <div class="rule"></div>
  <p class="meta"><span id="series">Sheet 01 — Formula 1 Singapore 2026</span><span class="scroll">Scroll<i></i></span></p>
</section>

<main id="sheet"></main>

<section class="index" id="index">
  <div class="col">
    <p class="label"><span>Index</span><span id="total"></span></p>
    <ol id="list"></ol>
  </div>
  <div class="preview">
    <canvas id="process" aria-hidden="true"></canvas>
    <p class="plate steps" id="plate2"><button type="button" id="stepPrev" aria-label="Previous step" hidden>←</button><span id="stepNum"></span><span class="nm" id="stepName"></span><button type="button" id="stepNext" aria-label="Next step" hidden>→</button></p>
    <button type="button" class="labopen" id="labOpen">Develop a print yourself →</button>
  </div>
</section>

<footer><div class="sig"><span>© 2026 Liu Sigan</span><button type="button" id="ctOpen">Contact →</button></div><a href="#top">Top ↑</a></footer>

<div class="sheetview" id="sheetview" role="dialog" aria-modal="true" aria-label="Contact sheet" hidden>
  <div class="bar top"><span id="svName"></span><span class="svmeta"><span id="svCount"></span><button type="button" id="svClose">Close</button></span></div>
  <div class="svscroll" id="svScroll"><div class="svinner" id="svInner"></div></div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photograph" hidden>
  <div class="bar top"><span id="vName"></span><span class="vtools"><button type="button" id="develop">Develop</button><button type="button" id="close">Close</button></span></div>
  <div class="stage" id="stage"></div>
  <div class="bar bot"><span class="count"><span class="clip"><b id="num">01</b></span><span>/</span><span id="tot">01</span></span><div class="progress"><i id="prog"></i></div><span class="hint"><button type="button" id="prev" aria-label="Previous">←</button><button type="button" id="next" aria-label="Next">→</button></span></div>
</div>

<div class="contact" id="contact" role="dialog" aria-modal="true" aria-label="Contact" hidden>
  <div class="bar top"><span>Contact</span><button type="button" id="ctClose">Close</button></div>
  <div class="ctscroll"><div class="ctinner">
    <div class="ctinfo">
      <h2>Get in touch</h2>
      <p><span>Email</span><a href="mailto:sliu050@e.ntu.edu.sg">sliu050@e.ntu.edu.sg</a></p>
      <p><span>Phone</span><a href="tel:+6588733414">+65 8873 3414</a></p>
    </div>
    <form class="ctform" id="ctForm" novalidate>
      <label><span>Your name</span><input type="text" name="name" autocomplete="name" required /></label>
      <label><span>Your email</span><input type="email" name="email" autocomplete="email" required /></label>
      <label><span>Message</span><textarea name="message" rows="4" required></textarea></label>
      <input type="checkbox" name="botcheck" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <p class="ctsend"><button type="submit">Send →</button><span id="ctNote" role="status"></span></p>
    </form>
  </div></div>
</div>

<div class="lab" id="lab" role="dialog" aria-modal="true" aria-label="Develop a print" hidden>
  <div class="bar top"><span id="labName"></span><button type="button" id="labClose">Close</button></div>
  <canvas id="labCanvas"></canvas>
  <div class="bar bot"><span id="labHint"></span><div class="progress"><i id="labProg"></i></div><span id="labClock"></span><button type="button" id="labBack">Back →</button></div>
</div>

<script src="./photos.js"></script>
<script src="./script.js"></script>
<script src="./sketch.js"></script>
</body>
</html>
