<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liu Sigan — Photographs</title>
<meta name="description" content="Black and white photographs by Liu Sigan." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@300;400&family=Reenie+Beanie&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".04 .9" numOctaves="2" result="t" /><feDisplacementMap in="SourceGraphic" in2="t" scale="2.6" /></filter>
</svg>

<header class="bar top" id="sitebar">
  <a href="#top">Liu Sigan</a>
  <nav><a href="#sheet">Sheet</a><a href="#index">Index</a><button type="button" data-play>Play reel →</button></nav>
</header>

<section class="hero" id="top">
  <h1><span>Liu</span><span>Sigan</span></h1>
  <button class="leader" type="button" data-play aria-label="Play reel"><i></i><b>Play<br />reel</b></button>
  <p class="sub"><span>Photographs in black &amp; white</span><span>Series 01 — City at night</span><span id="total">Frames ↓</span></p>
</section>

<main id="sheet"></main>

<section class="index" id="index">
  <p class="label"><span>Index</span><span>Select a title</span></p>
  <ol id="list"></ol>
</section>

<footer><span>© 2026 Liu Sigan</span><a href="#top">Back to top ↑</a></footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Reel" hidden>
  <div class="flicker" aria-hidden="true"></div><div class="scratch" aria-hidden="true"></div>
  <div class="bar top"><span>Liu Sigan — Reel 01</span><button type="button" id="close">Close ×</button></div>
  <div class="reel" id="reel" tabindex="0"></div>
  <div class="bar bot"><span id="count">01 / 01</span><div class="progress"><i id="prog"></i></div><span class="hint">← → / Scroll</span></div>
</div>

<div class="cursor" id="cursor" aria-hidden="true">View</div>
<div class="peek" id="peek" aria-hidden="true"><img alt="" /></div>

<script src="./photos.js"></script>
<script src="./script.js"></script>
</body>
</html>
